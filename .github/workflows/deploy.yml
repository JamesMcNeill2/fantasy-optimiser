name: Terraform Deploy

on:
  push:
    branches: [main, dev, 'feature/**']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/live

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # main -> prod, dev -> dev, feature/Foo-Bar -> feature-foo-bar
      # Branch name is passed via env to avoid script injection
      - name: Set Workspace Name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) WORKSPACE=prod ;;
            dev)  WORKSPACE=dev ;;
            *)
              WORKSPACE=$(printf '%s' "$BRANCH" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
                | cut -c1-30 \
                | sed -E 's/-+$//')
              ;;
          esac
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Could not derive a workspace name from '$BRANCH'"
            exit 1
          fi
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Ruff
        working-directory: .
        run: |
          uv run --locked --only-dev ruff check
          uv run --locked --only-dev ruff format --check

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: eu-west-2

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Select Workspace
        run: terraform workspace select -or-create "$WORKSPACE"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply ECR
        run: terraform apply -lock-timeout=5m -auto-approve -target=module.ecr

      - name: Read ECR Repository URLs
        id: ecr
        run: |
          repos=$(terraform output -json ecr_repository_urls)
          api=$(jq -r '.api' <<< "$repos")
          batch=$(jq -r '.batch' <<< "$repos")
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "registry=${api%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region eu-west-2 |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and Push Images
        working-directory: .
        env:
          API_REPO: ${{ steps.ecr.outputs.api }}
          BATCH_REPO: ${{ steps.ecr.outputs.batch }}
          TAG: ${{ github.sha }}
        run: |
          build_and_push() {
            local svc=$1 repo=$2
            if aws ecr describe-images --region eu-west-2 \
                --repository-name "${repo#*/}" \
                --image-ids imageTag="$TAG" > /dev/null 2>&1; then
              echo "::notice::$svc:$TAG already in ECR, skipping"
              return
            fi
            docker build --platform linux/amd64 --provenance=false \
              -f "services/$svc/Dockerfile" -t "$repo:$TAG" .
            docker push "$repo:$TAG"
          }
          build_and_push api "$API_REPO"
          build_and_push batch "$BATCH_REPO"

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m tfplan
