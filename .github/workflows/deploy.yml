name: Terraform Deploy

on:
  push:
    branches: [main, dev, "feature/**"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Lint, tests, Terraform checks and the SPA build, read-only with no secrets
  # and no OIDC token: dependencies never run where they could reach AWS
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      upload-frontend-dist: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_image_tag: ${{ github.sha }}
    defaults:
      run:
        working-directory: infra/live

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # main -> prod, dev -> dev, feature/Foo-Bar -> feature-foo-bar
      # Branch name is passed via env to avoid script injection
      - name: Set Workspace Name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) WORKSPACE=prod ;;
            dev)  WORKSPACE=dev ;;
            *)
              WORKSPACE=$(printf '%s' "$BRANCH" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
                | cut -c1-30 \
                | sed -E 's/-+$//')
              ;;
          esac
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Could not derive a workspace name from '$BRANCH'"
            exit 1
          fi
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2 # keep in step with TERRAFORM_VERSION in checks.yml, destroy-feature.yml and local Terraform
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: eu-west-2

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Select Workspace
        run: terraform workspace select -or-create "$WORKSPACE"

      - name: Terraform Apply ECR
        env:
          TF_VAR_league_ids: ${{ secrets.LEAGUE_IDS }}
        run: terraform apply -no-color -lock-timeout=5m -auto-approve -target=module.ecr

      - name: Read ECR Repository URLs
        id: ecr
        run: |
          repos=$(terraform output -json ecr_repository_urls)
          api=$(jq -r '.api' <<< "$repos")
          batch=$(jq -r '.batch' <<< "$repos")
          {
            echo "api=$api"
            echo "batch=$batch"
            echo "registry=${api%%/*}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region eu-west-2 |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and Push Images
        working-directory: .
        env:
          API_REPO: ${{ steps.ecr.outputs.api }}
          BATCH_REPO: ${{ steps.ecr.outputs.batch }}
          TAG: ${{ env.TF_VAR_image_tag }}
        run: |
          build_and_push() {
            local svc=$1 repo=$2
            if aws ecr describe-images --region eu-west-2 \
                --repository-name "${repo#*/}" \
                --image-ids imageTag="$TAG" > /dev/null 2>&1; then
              echo "::notice::$svc:$TAG already in ECR, skipping"
              return
            fi
            docker build --platform linux/amd64 --provenance=false \
              -f "services/$svc/Dockerfile" -t "$repo:$TAG" .
            docker push "$repo:$TAG"
          }
          build_and_push api "$API_REPO"
          build_and_push batch "$BATCH_REPO"

      - name: Terraform Plan
        env:
          TF_VAR_league_ids: ${{ secrets.LEAGUE_IDS }}
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Download Frontend Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      # Assets first, so the new index.html never points at missing files.
      # Excluded files are never deleted, so each sync only cleans up its own part.
      - name: Publish Frontend
        run: |
          BUCKET=$(terraform output -raw frontend_bucket_name)
          DIST_ID=$(terraform output -raw frontend_distribution_id)
          aws s3 sync ../../frontend/dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" --delete --no-progress
          aws s3 sync ../../frontend/dist "s3://$BUCKET" \
            --exclude "assets/*" --exclude "avatars/*" --cache-control "no-cache" --delete --no-progress
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
