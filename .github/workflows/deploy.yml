name: Terraform Deploy

on:
  push:
    branches: [main, dev, 'feature/**']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/live

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # main -> prod, dev -> dev, feature/Foo-Bar -> feature-foo-bar
      # Branch name is passed via env to avoid script injection
      - name: Set Workspace Name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main) WORKSPACE=prod ;;
            dev)  WORKSPACE=dev ;;
            *)
              WORKSPACE=$(printf '%s' "$BRANCH" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
                | cut -c1-30 \
                | sed -E 's/-+$//')
              ;;
          esac
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Could not derive a workspace name from '$BRANCH'"
            exit 1
          fi
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version:: '3.13'

      - name: Ruff
        working-directory: .
        run: |
          pip install ruff==0.16.5
          ruff check .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: eu-west-2

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Select Workspace
        run: terraform workspace select -or-create "$WORKSPACE"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m tfplan