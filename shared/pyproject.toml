[project]
name = "shared"
version = "0.1.0"
description = "A folder that holds all of the shared functions and classes"
authors = [
    { email = "245873540+JamesMcNeill2@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
